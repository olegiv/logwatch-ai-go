# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    # The deploy/ scripts run on Linux but are authored on macOS, so the
    # runner is the only place they are linted and unit-tested under GNU
    # userland (a BSD-only mktemp template once made REF deploys fail on
    # Linux while working locally). Note this does not execute the remote
    # payloads, where most of the GNU-specific calls live — those are linted
    # by the step below but not run. shellcheck is preinstalled here.
    - name: Shell lint
      run: shellcheck -x deploy/*.sh

    # shellcheck treats a quoted heredoc as data, so `shellcheck -x deploy/*.sh`
    # reports clean while several hundred lines of root-executed payload go
    # unchecked. This extracts and lints them.
    - name: Payload lint
      run: bash deploy/lint-payloads.sh

    - name: Shell tests
      run: bash deploy/lib_test.sh
