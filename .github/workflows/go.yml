# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Install quality tools
      run: |
        make install-tools
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    # Use the same fail-closed gate that deploy.sh runs. This includes Go
    # formatting, vet, pinned linting, normal and race-enabled Go tests,
    # shellcheck for deploy/ and scripts/, deployment state-machine tests, and
    # a reachable-code vulnerability scan. On Linux the state-machine tests
    # exercise real GNU mv -T, readlink -f and production shell semantics.
    - name: Quality gate
      run: make check

    - name: Production Linux AMD64 build
      run: make build-linux-amd64
